<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Recettes">
<meta name="theme-color" content="#f3f4f1">
<title>Les recettes de Lucie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..700&family=Hanken+Grotesk:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<section class="gate" id="gate" aria-live="polite">
  <div class="gate-card" id="gate-card">
    <h1>Les recettes de Lucie</h1>
    <p class="kicker">Fiches techniques</p>
    <p>Ouverture…</p>
  </div>
</section>
<div class="app" id="app" hidden>
  <aside class="index" aria-label="Index des recettes">
    <div class="brand">
      <h1>Les recettes de Lucie</h1>
      <p id="count"></p>
      <p class="sync" id="sync" hidden></p>
    </div>
    <div class="tools">
      <label class="visually-hidden" for="q">Rechercher une recette ou un ingrédient</label>
      <input class="search" id="q" type="search" placeholder="Recette ou ingrédient…" autocomplete="off">
      <div class="cats" id="cats" role="group" aria-label="Catégories"></div>
    </div>
    <nav class="list" id="list"></nav>
    <div class="index-foot">
      <a class="btn" href="#nouvelle">Ajouter une recette</a>
      <a class="btn ghost" href="#sauvegarde">Sauvegarde</a>
    </div>
  </aside>
  <main class="sheet-wrap" id="main"></main>
</div>
<script type="module" src="auth.js"></script>
</body>
</html>
